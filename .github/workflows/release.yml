name: release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0 or v0.3.0) — creates tag + release"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      # version without leading v, e.g. 0.3.0
      RELEASE_VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          RAW="${RELEASE_VERSION}"
          RAW="${RAW#v}"
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version '$RAW' — expected semver like 0.3.0"
            exit 1
          fi
          # if workflow_dispatch gave a version, create & push the tag
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            TAG="v${RAW}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists"
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
            echo "Created and pushed $TAG"
          fi
          echo "version=$RAW" >> "$GITHUB_OUTPUT"
          echo "tag=v$RAW" >> "$GITHUB_OUTPUT"
          echo "zip=SharpFocus-${RAW}.zip" >> "$GITHUB_OUTPUT"
          echo "Resolved $RAW (tag v$RAW)"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
          swift --version

      - name: Build SharpFocus.app
        working-directory: app
        env:
          SHARPFOCUS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./Scripts/bundle.sh
          ls -lh build/SharpFocus.app
          plutil -p build/SharpFocus.app/Contents/Info.plist | head -n 20

      - name: Create zip + checksum
        working-directory: app
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="build/SharpFocus-${VERSION}.zip"
          rm -f "$ZIP" "$ZIP.sha256"
          ditto -c -k --sequesterRsrc --keepParent build/SharpFocus.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          ls -lh "$ZIP" "$ZIP.sha256"
          cat "$ZIP.sha256"

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")"
          {
            echo "notes<<EOF"
            echo "SharpFocus ${TAG}"
            echo ""
            if [[ -n "$PREV" ]]; then
              echo "Changes since ${PREV}:"
              echo ""
              git log "${PREV}..HEAD" --pretty=format:"- %s (%h)" --no-merges | head -n 100
              echo ""
              echo ""
              echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
            else
              git log --pretty=format:"- %s (%h)" --no-merges | head -n 100
              echo ""
            fi
            echo ""
            echo "### Install"
            echo "Download \`${{ steps.version.outputs.zip }}\`, unzip, and move \`SharpFocus.app\` to \`/Applications\`."
            echo "Ad-hoc signed — first launch: System Settings → Privacy & Security → Open Anyway, or \`xattr -cr /Applications/SharpFocus.app\`."
            echo ""
            echo "### Checksum"
            echo '```'
            cat "app/build/${{ steps.version.outputs.zip }}.sha256"
            echo '```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            app/build/${{ steps.version.outputs.zip }}
            app/build/${{ steps.version.outputs.zip }}.sha256
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
