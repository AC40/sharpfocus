    - region [ref=e408]:
      - heading "02 It never sees your screen" [level=2] [ref=e409]
      - generic [ref=e410]:
        - paragraph [ref=e411]: "Most dimming tools ask for Screen Recording permission. That's a big ask: it means handing an app the right to read every pixel you look at, forever."
        - paragraph [ref=e412]: Sharp Focus asks the window server to desaturate what's behind its own overlay — the same private compositing path that gives sidebars their vibrancy. The app never receives a frame. If a future macOS release breaks that path, it falls back to plain dimming, which needs no permission either; the ScreenCaptureKit engine is there, but you have to choose it.
    - region [ref=e413]:
      - heading "03 Three sliders, and rules that pull them for you" [level=2] [ref=e414]
      - generic [ref=e415]:
        - paragraph [ref=e416]: Grayscale, blur, dimming. They stack, they're live, and they're in the menu bar so you never open a settings window to nudge one.
        - paragraph [ref=e417]:
          - strong [ref=e418]: Deep Work
          - text: ","
          - strong [ref=e419]: Soft Focus
          - text: and
          - strong [ref=e420]: Monochrome
          - text: "are there when you don't want to think about it. Automation ties them to a clock or to a macOS Focus mode: weekdays 09:00–13:00, or whenever Do Not Disturb comes on. An"
          - emphasis [ref=e421]: Always in Focus
          - text: list keeps chosen apps in color no matter what — most people put their music player there.
    - region [ref=e422]:
      - heading "04 Scriptable, because you'll want to" [level=2] [ref=e423]
      - generic [ref=e424]:
        - paragraph [ref=e425]: A global hotkey (⌃⌥⌘F), a CLI, and a URL scheme. Wire it into Raycast, Alfred, Shortcuts, a tmux keybinding, whatever you already use to start your day.
        - code [ref=e427]: // shell sfctl enabled 1 sfctl grayscale 0.8 sfctl mode frontApp // Raycast, Alfred, Shortcuts open "sharpfocus://preset/deep-work"
    - region [ref=e428]:
      - heading "05 Open source, and small enough to read" [level=2] [ref=e429]
      - paragraph [ref=e431]: A few thousand lines of Swift, no dependencies, no analytics, no account, no update nag. If it does something you don't like, the file that does it is easy to find.
    - region [ref=e432]:
      - heading "How it works" [level=2] [ref=e433]
      - paragraph [ref=e434]:
        - text: One borderless, click-through overlay window per display sits just above your app windows. A mask cuts holes over whatever is in focus, and the hole geometry is occlusion-aware — a window floating on top of your editor still gets filtered, instead of punching a hole through it. Window frames come from polling
        - code [ref=e435]: CGWindowList
        - text: at 15 Hz, so there's no Accessibility permission either.
      - paragraph [ref=e436]: The fast path uses a private CoreAnimation API. It's been stable for years, but it isn't guaranteed — availability is probed at launch and the app falls back on its own if it ever goes away.
